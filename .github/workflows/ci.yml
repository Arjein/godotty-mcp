name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint + unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install gdtoolkit
        run: pip install 'gdtoolkit==4.5.0'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  package:
    name: Package (npm + addon)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack and check contents
        run: |
          set -euo pipefail
          npm pack -w server --pack-destination "$RUNNER_TEMP" > /dev/null
          tarball="$RUNNER_TEMP/godotty-mcp-$(node -p "require('./server/package.json').version").tgz"
          tar tzf "$tarball" | tee "$RUNNER_TEMP/files.txt"
          for f in package/dist/index.js package/addon/godotty_mcp/plugin.cfg \
                   package/addon/godotty_mcp/runtime/godotty_runtime.gd package/README.md package/LICENSE; do
            grep -qx "$f" "$RUNNER_TEMP/files.txt" || { echo "missing $f"; exit 1; }
          done
          ! grep -q '\.map$' "$RUNNER_TEMP/files.txt"
          echo "tarball=$tarball" >> "$GITHUB_ENV"
      - name: Install the tarball and use install-addon
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/game"
          cd "$RUNNER_TEMP/app" && npm init -y > /dev/null && npm install "$tarball"
          printf 'config_version=5\n' > "$RUNNER_TEMP/game/project.godot"
          npx godotty-mcp install-addon --project "$RUNNER_TEMP/game"
          test -f "$RUNNER_TEMP/game/addons/godotty_mcp/plugin.gd"
          npx godotty-mcp --help
      - run: scripts/package-addon.sh "$RUNNER_TEMP/release"

  integration:
    name: Integration (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    needs: lint-and-unit
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version and the latest pinned release.
        godot: ['4.5.2', '4.7.2']
    env:
      GODOT_PATH: ${{ github.workspace }}/.godot-bin/godot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: .godot-bin
          key: godot-${{ matrix.godot }}-linux-x86_64
      - name: Download and verify Godot ${{ matrix.godot }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tag="${{ matrix.godot }}-stable"
          zip="Godot_v${tag}_linux.x86_64.zip"
          base="https://github.com/godotengine/godot/releases/download/${tag}"
          mkdir -p .godot-bin && cd .godot-bin
          curl -fsSLO "${base}/${zip}"
          curl -fsSLO "${base}/SHA512-SUMS.txt"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${zip}"
          mv "Godot_v${tag}_linux.x86_64" godot
          chmod +x godot
          rm "${zip}" SHA512-SUMS.txt
      - name: Cache test framework archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/godotty-mcp/test-addons
          key: test-addons-${{ hashFiles('scripts/fetch-test-addons.sh') }}
      - run: ${{ env.GODOT_PATH }} --version
      - name: Install virtual display and software OpenGL
        # Windowed runs (screenshots) render through Mesa llvmpipe under Xvfb.
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0
      - run: npm ci
      - run: xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:integration
